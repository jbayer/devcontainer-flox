    "profile": {
      "common": "# symlink the shared .devcontainer into the current directory\n# alias devc='ln -s ~/workspaces/devcontainers/.devcontainer .devcontainer'\n# alias devc-cp='cp -R ~/workspaces/devcontainers/.devcontainer .'\n\ncase \"$(uname -s)\" in\n  Darwin)\n    FLOX_HOST_ICON=\"🍎\"   # macOS — reminder you are NOT in a container\n      ;;\n  Linux)\n    _host=\"$(hostname -s 2>/dev/null || hostname)\"\n    _host=\"$(printf '%s' \"$_host\" | tr '[:upper:]' '[:lower:]')\"\n    case \"$_host\" in\n      ubuntu*) FLOX_HOST_ICON=\"🐧\" ;;   # main container\n      *)       FLOX_HOST_ICON=\"🐧 $_host\" ;; # any other host: full name\n    esac\n    ;;\nesac\n",
      "bash": "  PS1=\"\\[\\033[01;32m\\]${FLOX_HOST_ICON}\\[\\033[00m\\]:\\[\\033[01;34m\\]\\W\\[\\033[00m\\]\\\\$ \"\n",
      "zsh": "  PROMPT=\"%B%F{green}${FLOX_HOST_ICON}%f:%F{blue}%1~%f%b\\$ \"\n  eval \"$(atuin init zsh)\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
